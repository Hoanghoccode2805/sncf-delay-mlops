train:
    random_state : 42
    train_end_year: 2024
    test_start_year: 2025
models:
    Ridge_Regression:
        regressor__alpha : [0.1,1.0,10.0,100.0]
    Random_Forest:
        n_estimators: [100, 200, 300]
        max_depth: [10, 15, 20, null]
        min_samples_split: [2, 5, 10]
